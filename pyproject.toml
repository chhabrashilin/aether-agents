[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-agents"
version = "0.1.0"
description = "Multi-agent air-quality intelligence for Delhi–NCT winter smog episodes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "AetherAgents researchers" },
]
keywords = ["air-quality", "Delhi", "AQI", "GRAP", "multi-agent", "CIRRUS"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]
eval = [
  "jupyter>=1.0.0",
  "matplotlib>=3.8.0",
]

[tool.setuptools.package-data]
aether_agents = ["eval/data/*.json"]

[project.scripts]
aether-worker = "aether_agents.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
