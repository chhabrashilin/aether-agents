{{- if .Values.postgres.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.name }}-app-user-esos
  labels:
    {{- include "aether-agents.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ .Values.postgres.name }}-app-user
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgres.app.secretPath }}
        property: {{ .Values.postgres.app.usernameKey }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgres.app.secretPath }}
        property: {{ .Values.postgres.app.passwordKey }}
{{- if .Values.postgres.superUser.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.name }}-superuser-esos
  labels:
    {{- include "aether-agents.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ .Values.postgres.name }}-superuser
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgres.superUser.secretPath }}
        property: {{ .Values.postgres.superUser.usernameKey }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgres.superUser.secretPath }}
        property: {{ .Values.postgres.superUser.passwordKey }}
{{- end }}
{{- end }}
