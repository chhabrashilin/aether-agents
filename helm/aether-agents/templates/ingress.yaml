{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aether-agents.fullname" . }}
  labels:
    {{- include "aether-agents.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- else if .Values.ingress.visibility }}
  ingressClassName: traefik-{{ .Values.ingress.visibility }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.fqdn | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "api" }}
                name: {{ include "aether-agents.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
                {{- else }}
                name: {{ include "aether-agents.fullname" $ }}-dashboard
                port:
                  number: {{ $.Values.dashboard.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
