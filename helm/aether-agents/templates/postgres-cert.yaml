{{- if .Values.postgres.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.postgres.name }}-selfsigned-issuer
  labels:
    {{- include "aether-agents.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.postgres.name }}-server-cert
  labels:
    {{- include "aether-agents.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.postgres.name }}-server-cert
  usages:
    - server auth
  dnsNames:
    - "{{ .Values.postgres.name }}.k8s.ucar.edu"
    - {{ .Values.postgres.name }}-rw
    - {{ .Values.postgres.name }}-rw.{{ .Release.Namespace }}
    - {{ .Values.postgres.name }}-rw.{{ .Release.Namespace }}.svc
    - {{ .Values.postgres.name }}-r
    - {{ .Values.postgres.name }}-r.{{ .Release.Namespace }}
    - {{ .Values.postgres.name }}-r.{{ .Release.Namespace }}.svc
    - {{ .Values.postgres.name }}-ro
    - {{ .Values.postgres.name }}-ro.{{ .Release.Namespace }}
    - {{ .Values.postgres.name }}-ro.{{ .Release.Namespace }}.svc
  issuerRef:
    name: {{ .Values.postgres.name }}-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
