apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aether-agents.fullname" . }}-config
  labels:
    {{- include "aether-agents.labels" . | nindent 4 }}
data:
  AETHER_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AETHER_REGION: {{ .Values.config.region | quote }}
  AETHER_WORKER_INTERVAL_SECONDS: {{ .Values.config.workerIntervalSeconds | quote }}
  AETHER_WORKER_PIPELINE: {{ .Values.config.workerPipelineMode | default "fixture" | quote }}
  {{- if .Values.config.databaseUrl }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  {{- end }}
